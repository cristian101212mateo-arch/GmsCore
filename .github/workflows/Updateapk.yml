name: Upload microG APK

permissions: {}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build microG Debug APK
        run: ./gradlew :play-services-core:assembleDebug --no-configuration-cache

      - name: Show APK files
        run: find . -name "*.apk" -path "*/outputs/*" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: microg-apk
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 30
