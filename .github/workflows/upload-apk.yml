name: Build and Upload microG APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build microG APK
        run: ./gradlew :play-services-core:assembleDebug --no-configuration-cache

      - name: Show APKs
        run: find . -name "*.apk" -path "*/outputs/*" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: microg-apk
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 30
